[package]
name = "peregrine-core"
description = "Peregrine: a CPU inference engine for language models that reports the bytes it moved per token"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["llm", "inference", "cpu", "gguf", "simd"]
categories = ["science", "algorithms"]
publish = false

# memmap2 is the only dependency, on purpose (docs/adr/0002-dependency-policy.md). Everything else this crate
# needs is either trivial (f16 conversion is twenty lines) or a liability: a tensor framework would bring back
# the materialise-a-dequantised-buffer pattern the engine exists to avoid, and rayon would make thread and
# barrier counts unpredictable when both are quantities this engine measures and reports.
[dependencies]
peregrine-kernels = { workspace = true, default-features = false }
memmap2 = { workspace = true }

[features]
default = [
    "fmt-kquant",
    "fmt-ternary",
    "fmt-iq",
    "fmt-legacy",
    "littlebit",
    "dspark",
    "mtp",
]
fmt-kquant = ["peregrine-kernels/fmt-kquant"]
fmt-ternary = ["peregrine-kernels/fmt-ternary"]
fmt-iq = ["peregrine-kernels/fmt-iq"]
fmt-legacy = ["peregrine-kernels/fmt-legacy"]
littlebit = []
dspark = ["fmt-kquant", "fmt-legacy"]
mtp = []
check-disjoint = []

[[test]]
name = "q4k_requant"
required-features = ["fmt-kquant"]

[[test]]
name = "tern"
required-features = ["fmt-ternary"]

[[test]]
name = "oracle"
required-features = ["fmt-kquant"]

[[test]]
name = "simd"
required-features = ["fmt-kquant"]

[lints]
workspace = true
