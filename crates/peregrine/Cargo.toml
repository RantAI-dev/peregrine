[package]
name = "peregrine"
description = "Peregrine: a CPU inference engine for language models (facade crate and the `peregrine` command)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
publish = false

[[bin]]
name = "peregrine"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli_bench"
required-features = ["cli"]

[[test]]
name = "support_cmd"
required-features = ["cli"]

[[test]]
name = "fetch_preflight"
required-features = ["cli"]

[[test]]
name = "hf_cold_cache"
required-features = ["cli"]

[[test]]
name = "serve_lifetime"
required-features = ["cli", "server"]

[features]
default = [
    "cli",
    "server",
    "arch-llama",
    "arch-qwen",
    "arch-qwen35",
    "arch-gemma3",
    "arch-qwen3moe",
    "arch-gpt-oss",
    "arch-phi3",
    "fmt-mxfp4",
    "fmt-kquant",
    "fmt-ternary",
    "fmt-iq",
    "fmt-legacy",
    "littlebit",
    "dspark",
    "mtp",
]
# The OpenAI-compatible HTTP server (`peregrine serve`, `peregrine::server`).
server = ["dep:peregrine-server", "dep:tokio"]
# The `peregrine` command line.
cli = ["dep:clap", "dep:serde_json"]

# Architectures
arch-llama = ["peregrine-models/arch-llama"]
arch-qwen = ["peregrine-models/arch-qwen"]
arch-qwen35 = ["peregrine-models/arch-qwen35"]
arch-gemma3 = ["peregrine-models/arch-gemma3"]
arch-qwen3moe = ["peregrine-models/arch-qwen3moe"]
arch-gpt-oss = ["peregrine-models/arch-gpt-oss"]
arch-phi3 = ["peregrine-models/arch-phi3"]

# Formats
fmt-mxfp4 = [
    "peregrine-core/fmt-mxfp4",
    "peregrine-kernels/fmt-mxfp4",
    "peregrine-models/fmt-mxfp4",
]
fmt-kquant = [
    "peregrine-core/fmt-kquant",
    "peregrine-kernels/fmt-kquant",
    "peregrine-models/fmt-kquant",
]
fmt-ternary = [
    "peregrine-core/fmt-ternary",
    "peregrine-kernels/fmt-ternary",
    "peregrine-models/fmt-ternary",
]
fmt-iq = [
    "peregrine-core/fmt-iq",
    "peregrine-kernels/fmt-iq",
    "peregrine-models/fmt-iq",
]
fmt-legacy = [
    "peregrine-core/fmt-legacy",
    "peregrine-kernels/fmt-legacy",
    "peregrine-models/fmt-legacy",
]

# Extras
littlebit = [
    "peregrine-core/littlebit",
    "peregrine-models/littlebit",
]
dspark = [
    "peregrine-core/dspark",
    "peregrine-models/dspark",
]
mtp = [
    "peregrine-core/mtp",
    "peregrine-models/mtp",
]

[dependencies]
peregrine-core = { workspace = true, default-features = false }
peregrine-kernels = { workspace = true, default-features = false }
peregrine-models = { workspace = true, default-features = false }
peregrine-server = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
