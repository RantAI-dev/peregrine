[package]
name = "peregrine-models"
description = "Model architecture implementations for Peregrine (ADR 0005, ADR 0006)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
peregrine-core = { workspace = true, default-features = false }
peregrine-kernels = { workspace = true, default-features = false }

[features]
default = [
    "arch-llama",
    "arch-qwen",
    "arch-qwen35",
    "arch-gemma3",
    "arch-gemma-embedding",
    "arch-bert",
    "arch-modern-bert",
    "arch-qwen3moe",
    "arch-gpt-oss",
    "arch-phi3",
    "arch-mistral3",
    "fmt-mxfp4",
    "fmt-kquant",
    "fmt-ternary",
    "fmt-iq",
    "fmt-legacy",
    "littlebit",
    "dspark",
    "mtp",
]

# Architectures
arch-llama = []
arch-qwen = []
arch-qwen35 = []
arch-gemma3 = []
arch-gemma-embedding = []
arch-bert = []
arch-modern-bert = []
arch-qwen3moe = []
arch-gpt-oss = []
arch-phi3 = []
arch-mistral3 = []

# Formats passed through to core and kernels
fmt-mxfp4 = ["peregrine-core/fmt-mxfp4", "peregrine-kernels/fmt-mxfp4"]
fmt-kquant = ["peregrine-core/fmt-kquant", "peregrine-kernels/fmt-kquant"]
fmt-ternary = ["peregrine-core/fmt-ternary", "peregrine-kernels/fmt-ternary"]
fmt-iq = ["peregrine-core/fmt-iq", "peregrine-kernels/fmt-iq"]
fmt-legacy = ["peregrine-core/fmt-legacy", "peregrine-kernels/fmt-legacy"]

# Extras passed through to core
littlebit = ["peregrine-core/littlebit"]
dspark = ["peregrine-core/dspark"]
mtp = ["peregrine-core/mtp"]

[[test]]
name = "batch"
required-features = ["arch-qwen", "fmt-kquant"]

[[test]]
name = "bonsai"
required-features = ["arch-qwen35", "mtp", "fmt-ternary"]

[[test]]
name = "dspark"
required-features = ["dspark", "arch-qwen"]

[[test]]
name = "drafters"
required-features = ["arch-qwen", "arch-qwen35", "dspark", "mtp", "fmt-legacy", "fmt-ternary"]

[[test]]
name = "dspark_k"
required-features = ["arch-qwen", "dspark", "fmt-kquant"]

[[test]]
name = "engine"
required-features = ["arch-qwen", "fmt-kquant"]

[[test]]
name = "kq"
required-features = ["arch-llama", "fmt-kquant"]

[[test]]
name = "golden"
required-features = ["arch-qwen", "fmt-kquant"]

[[test]]
name = "lbq"
required-features = ["littlebit", "arch-llama"]

[[test]]
name = "no_alloc"
required-features = ["arch-llama", "arch-qwen", "arch-qwen35", "arch-qwen3moe", "arch-phi3", "arch-mistral3", "mtp", "fmt-ternary"]

[[test]]
name = "runtime_parity"
required-features = ["arch-qwen", "arch-qwen35", "dspark", "mtp", "fmt-legacy", "fmt-ternary"]

[[test]]
name = "serve"
required-features = ["arch-qwen", "fmt-kquant"]

[[test]]
name = "synthetic"
required-features = ["arch-llama", "arch-qwen", "arch-qwen35", "arch-qwen3moe", "arch-gemma3", "arch-gemma-embedding", "arch-bert", "arch-modern-bert", "arch-gpt-oss", "arch-phi3", "arch-mistral3", "mtp", "fmt-mxfp4", "fmt-kquant", "fmt-ternary", "fmt-legacy"]

[lints]
workspace = true
