# Record the synthetic goldens on one runner and upload them as an artefact to commit
# (docs/dev/testing.md). The golden directory of a tier carries the system when it is not Linux
# (`aarch64-neon-dotprod-macos`, `x86_64-avx2-windows`), so a platform whose goldens are missing
# records them on its own hardware. This is a manual job: it never commits anything itself.
#
# Every runner choice runs the same bash steps. The Windows steps say `shell: bash` because the
# runner's default is PowerShell: they use the Git Bash that ships with it, where `$RUNNER_TEMP`,
# `tee`, `grep` and `tar` are the GNU/bsdtar tools the steps expect. Recording the Windows goldens
# themselves is S7.4.
#
# The same run is then repeated without `PEREGRINE_GOLDEN` and must reproduce every recorded
# value; a file that differs between two runs of the same commit is a determinism bug, not a
# golden to keep.
#
# `isa` pins the tier the goldens are recorded for (`PEREGRINE_ISA`: `scalar`, `avx2`, ...), so a
# runner pool with mixed CPUs (the Windows one draws either the AVX2 or the AVX-512 tier) records a
# set every runner of the pool can reproduce. Empty is the runner's own tier.
name: record-goldens
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to record on"
        type: choice
        options:
          - macos-15
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
        default: macos-15
      isa:
        description: "PEREGRINE_ISA cap for every step (empty = the runner's own tier)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: record-goldens-${{ inputs.runner }}-${{ inputs.isa || 'native' }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # An empty value parses as no cap (the runner's own tier).
  PEREGRINE_ISA: ${{ inputs.isa }}
jobs:
  record:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The pool is mixed: the log must say which CPU and which ISA cap produced the set.
      - name: the CPU this runner reports
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          case "$RUNNER_OS" in
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            *) grep -m1 'model name' /proc/cpuinfo || true ;;
          esac
          echo "PEREGRINE_ISA=${PEREGRINE_ISA:-native}"
      - name: count the missing goldens before recording
        shell: bash
        run: |
          set -o pipefail
          cargo test -p peregrine-models --release --locked \
            --test synthetic --test embeddings --test bert_heads \
            --test modern_bert_heads --test session_fixture -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/before.log"
          echo "skips before: $(grep -E -c 'no golden for tier|no recording for tier' "$RUNNER_TEMP/before.log" || true)"
      - name: record the synthetic goldens
        shell: bash
        env:
          PEREGRINE_GOLDEN: record
          PEREGRINE_SESSION_FIXTURE: record
        run: |
          set -o pipefail
          cargo test -p peregrine-models --release --locked \
            --test synthetic --test embeddings --test bert_heads \
            --test modern_bert_heads --test session_fixture -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/record.log"
      - name: the same run without the record switch must reproduce them
        shell: bash
        run: |
          set -o pipefail
          cargo test -p peregrine-models --release --locked \
            --test synthetic --test embeddings --test bert_heads \
            --test modern_bert_heads --test session_fixture -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/verify.log"
          # A missing golden is a skip; the recording must have covered the tier's tests.
          if grep -E -q 'no golden for tier|no recording for tier' "$RUNNER_TEMP/verify.log"; then
            echo "a golden was still missing after recording:" >&2
            grep -E 'no golden for tier|no recording for tier' "$RUNNER_TEMP/verify.log" >&2
            exit 1
          fi
          echo "skips before: $(grep -E -c 'no golden for tier|no recording for tier' "$RUNNER_TEMP/before.log" || true)"
          echo "skips after:  $(grep -E -c 'no golden for tier|no recording for tier' "$RUNNER_TEMP/verify.log" || true)"
      - name: collect the recorded files
        shell: bash
        run: |
          git add -A crates/peregrine-models/tests
          git diff --cached --name-only | tee "$RUNNER_TEMP/recorded.txt"
          # The Windows runner's tar reads an archive path of the form `D:\...` as a remote host
          # (`D:`); a POSIX path from the shell reads as local (MSYS maps /d/... back).
          out="$(cd "$RUNNER_TEMP" && pwd)/goldens.tar.gz"
          # An empty file list still produces an artefact; a re-record with nothing changed is a
          # valid run (the second suite proved the committed values reproduce).
          if [ -s "$RUNNER_TEMP/recorded.txt" ]; then
            tar -czf "$out" -T "$RUNNER_TEMP/recorded.txt"
          else
            tar -czf "$out" -T /dev/null
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens-${{ inputs.runner }}-${{ inputs.isa || 'native' }}
          path: |
            ${{ runner.temp }}/goldens.tar.gz
            ${{ runner.temp }}/recorded.txt
            ${{ runner.temp }}/before.log
            ${{ runner.temp }}/record.log
            ${{ runner.temp }}/verify.log
          if-no-files-found: error
