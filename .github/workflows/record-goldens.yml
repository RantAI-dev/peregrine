# Record the synthetic goldens on one runner and upload them as an artefact to commit
# (docs/dev/testing.md). The golden directory of a tier carries the system when it is not Linux
# (`aarch64-neon-dotprod-macos`), so a platform whose goldens are missing records them on its own
# hardware. This is a manual job: it never commits anything itself.
#
# The same run is then repeated without `PEREGRINE_GOLDEN` and must reproduce every recorded
# value; a file that differs between two runs of the same commit is a determinism bug, not a
# golden to keep.
name: record-goldens
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to record on"
        type: choice
        options:
          - macos-15
          - ubuntu-24.04
          - ubuntu-24.04-arm
        default: macos-15
permissions:
  contents: read
concurrency:
  group: record-goldens-${{ inputs.runner }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  record:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: count the missing goldens before recording
        run: |
          set -o pipefail
          cargo test -p peregrine-models --release --locked \
            --test synthetic --test embeddings --test bert_heads \
            --test modern_bert_heads --test session_fixture -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/before.log"
          echo "skips before: $(grep -E -c 'no golden for tier|no recording for tier' "$RUNNER_TEMP/before.log" || true)"
      - name: record the synthetic goldens
        env:
          PEREGRINE_GOLDEN: record
          PEREGRINE_SESSION_FIXTURE: record
        run: |
          set -o pipefail
          cargo test -p peregrine-models --release --locked \
            --test synthetic --test embeddings --test bert_heads \
            --test modern_bert_heads --test session_fixture -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/record.log"
      - name: the same run without the record switch must reproduce them
        run: |
          set -o pipefail
          cargo test -p peregrine-models --release --locked \
            --test synthetic --test embeddings --test bert_heads \
            --test modern_bert_heads --test session_fixture -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/verify.log"
          # A missing golden is a skip; the recording must have covered the tier's tests.
          if grep -E -q 'no golden for tier|no recording for tier' "$RUNNER_TEMP/verify.log"; then
            echo "a golden was still missing after recording:" >&2
            grep -E 'no golden for tier|no recording for tier' "$RUNNER_TEMP/verify.log" >&2
            exit 1
          fi
          echo "skips before: $(grep -E -c 'no golden for tier|no recording for tier' "$RUNNER_TEMP/before.log" || true)"
          echo "skips after:  $(grep -E -c 'no golden for tier|no recording for tier' "$RUNNER_TEMP/verify.log" || true)"
      - name: collect the recorded files
        run: |
          git add -A crates/peregrine-models/tests
          git diff --cached --name-only | tee "$RUNNER_TEMP/recorded.txt"
          tar -czf "$RUNNER_TEMP/goldens.tar.gz" -T "$RUNNER_TEMP/recorded.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens-${{ inputs.runner }}
          path: |
            ${{ runner.temp }}/goldens.tar.gz
            ${{ runner.temp }}/recorded.txt
            ${{ runner.temp }}/before.log
            ${{ runner.temp }}/record.log
            ${{ runner.temp }}/verify.log
          if-no-files-found: error
