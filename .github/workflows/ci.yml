# Every push to main and every PR. Actions are pinned to commits (the comment names the release);
# Dependabot keeps them current.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: check support table matches README
        run: |
          cargo run -q -p peregrine -- support --markdown > /tmp/generated-support.md
          python3 -c '
          import sys
          readme = open("README.md").read()
          begin, end = "<!-- support:begin -->", "<!-- support:end -->"
          if begin not in readme or end not in readme:
              sys.exit("Markers <!-- support:begin --> and <!-- support:end --> not found in README.md")
          block = readme.split(begin)[1].split(end)[0].strip()
          open("/tmp/readme-support.md", "w").write(block + "\n")
          '
          diff -u /tmp/readme-support.md /tmp/generated-support.md || {
              echo "Error: README.md support table is out of date."
              echo "Run 'cargo run -q -p peregrine -- support --markdown' and paste between <!-- support:begin --> and <!-- support:end --> in README.md."
              exit 1
          }
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-hack@0.6.46
      # Every feature combination must build (ADR 0005).
      - name: feature combinations
        run: |
          cargo hack check --each-feature --no-dev-deps -p peregrine-kernels
          cargo hack check --each-feature --no-dev-deps -p peregrine-core
          cargo hack check --each-feature --no-dev-deps -p peregrine-models
          cargo hack check --each-feature --no-dev-deps -p peregrine
          cargo check -p peregrine-kernels --no-default-features
          cargo check -p peregrine-core --no-default-features
          cargo check -p peregrine-models --no-default-features
          cargo check -p peregrine --no-default-features

  # Release mode: the kernels are tested as they ship, and debug-mode SIMD tests are too slow.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: macos-15, name: macos-aarch64 }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: test (x86-64, every target)
        if: runner.arch == 'X64'
        run: cargo test --workspace --release --locked
      # peregrine-bench's examples are x86-only benchmarks; the library, binaries and tests must build
      # warning-free and pass everywhere.
      - name: clippy (non-x86)
        if: runner.arch != 'X64'
        run: cargo clippy --workspace --lib --bins --tests --release --locked -- -D warnings
      - name: test (non-x86, lib + bins + tests)
        if: runner.arch != 'X64'
        run: cargo test --workspace --lib --bins --tests --release --locked

  # Every kernel tier below the runner's own, forced with PEREGRINE_ISA (S0.3). The native tier runs in
  # `test`; the CPU's features are printed so the log shows which tiers were real.
  tiers:
    strategy:
      fail-fast: false
      matrix: { isa: [scalar, avx2] }
    name: tier (${{ matrix.isa }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: CPU features
        run: grep -m1 -o -E 'avx2|avx512[a-z_]*|gfni|avx_vnni' /proc/cpuinfo | sort -u | tr '\n' ' '; grep -m1 'model name' /proc/cpuinfo
      - run: cargo test --workspace --release --locked
        env:
          PEREGRINE_ISA: ${{ matrix.isa }}
          # A pinned tier has a golden for every synthetic model: a missing one fails.
          PEREGRINE_GOLDEN: require

  # The AVX-512 tier on GitHub's AVX2-only runners, under Intel SDE (#7, S0.3b). SDE is Intel's
  # emulator, not a re-host: the official mirror URL and its SHA-256 are pinned below. Sapphire
  # Rapids (-spr) is the newest Intel target with everything the kernels use: AVX-512 F/BW/VL
  # plus VNNI, GFNI and VBMI. Tests are built natively, then the test binaries themselves run
  # under SDE, so cargo and rustc are not emulated. Not part of `ci-ok` yet.
  sde:
    runs-on: ubuntu-24.04
    env:
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Cache Intel SDE
        id: sde-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/intel-sde
          key: intel-sde-10.13.1-2026-07-28-lin
      - name: Download and verify Intel SDE
        if: steps.sde-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error "$SDE_URL" -o "$RUNNER_TEMP/sde.tar.xz"
          echo "$SDE_SHA256  $RUNNER_TEMP/sde.tar.xz" | sha256sum --check --strict
          mkdir -p "$HOME/.cache/intel-sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" --strip-components=1 -C "$HOME/.cache/intel-sde"
      - name: Build test binaries
        run: |
          cargo test --release --locked -p peregrine-kernels --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' > "$RUNNER_TEMP/kernel-tests"
          cargo test --release --locked -p peregrine-models --test synthetic --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' > "$RUNNER_TEMP/synthetic-tests"
      - name: Kernel tests under SDE
        run: |
          while read -r t; do "$HOME/.cache/intel-sde/sde64" -spr -- "$t"; done < "$RUNNER_TEMP/kernel-tests"
      - name: Synthetic models under SDE
        env:
          PEREGRINE_GOLDEN: require
          PEREGRINE_CALIBRATE: "0"
        run: |
          set -o pipefail
          while read -r t; do "$HOME/.cache/intel-sde/sde64" -spr -- "$t" --nocapture; done \
            < "$RUNNER_TEMP/synthetic-tests" 2>&1 | tee "$RUNNER_TEMP/synthetic.log"
          # Every synthetic model has an AVX-512 golden, and a missing one fails (PEREGRINE_GOLDEN=require);
          # this assertion proves SDE really exposed the AVX-512/VNNI/GFNI/VBMI features.
          grep -q 'x86_64-avx2-avx512-vnni-gfni-vbmi' "$RUNNER_TEMP/synthetic.log"

  # The AVX-VNNI-256 tier on Alder Lake (-adl: AVX-VNNI, no AVX-512) under Intel SDE (S2.6).
  # Same structure as the Sapphire Rapids job: tests built natively, run under SDE with -adl.
  sde-adl:
    runs-on: ubuntu-24.04
    env:
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Cache Intel SDE
        id: sde-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/intel-sde
          key: intel-sde-10.13.1-2026-07-28-lin
      - name: Download and verify Intel SDE
        if: steps.sde-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error "$SDE_URL" -o "$RUNNER_TEMP/sde.tar.xz"
          echo "$SDE_SHA256  $RUNNER_TEMP/sde.tar.xz" | sha256sum --check --strict
          mkdir -p "$HOME/.cache/intel-sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" --strip-components=1 -C "$HOME/.cache/intel-sde"
      - name: Build test binaries
        run: |
          cargo test --release --locked -p peregrine-kernels --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' > "$RUNNER_TEMP/kernel-tests"
          cargo test --release --locked -p peregrine-models --test synthetic --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' > "$RUNNER_TEMP/synthetic-tests"
      - name: Kernel tests under SDE (-adl)
        run: |
          while read -r t; do "$HOME/.cache/intel-sde/sde64" -adl -- "$t"; done < "$RUNNER_TEMP/kernel-tests"
      - name: Synthetic models under SDE (-adl)
        env:
          PEREGRINE_GOLDEN: require
          PEREGRINE_CALIBRATE: "0"
        run: |
          set -o pipefail
          while read -r t; do "$HOME/.cache/intel-sde/sde64" -adl -- "$t" --nocapture; done \
            < "$RUNNER_TEMP/synthetic-tests" 2>&1 | tee "$RUNNER_TEMP/synthetic.log"
          grep -q 'x86_64-avx2-vnni256' "$RUNNER_TEMP/synthetic.log"

  # The OpenAI compatibility suite: the real server, SmolLM2-360M-Instruct (the upload docs/dev/testing.md
  # pins), stdlib Python only. The model is cached by its SHA-256. The thinking-model check is skipped
  # here (it needs a second, larger file); tests/compat/README.md shows the local invocation.
  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked -p peregrine
      - name: Cache the compatibility model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/peregrine-compat
          key: compat-smollm2-360m-instruct-q4km-ade7aee1
      - name: Fetch SmolLM2-360M-Instruct Q4_K_M (pinned SHA-256)
        run: |
          dir="$HOME/.cache/peregrine-compat"
          file="$dir/SmolLM2-360M-Instruct.Q4_K_M.gguf"
          sha="ade7aee1e5bd7c3b8f1fedafc61a1a0be31e8afa64e006607cd202323e2ccce0"
          if [ ! -f "$file" ]; then
            mkdir -p "$dir"
            curl --fail --location --retry 3 \
              -o "$file.part" \
              "https://huggingface.co/mradermacher/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct.Q4_K_M.gguf"
            echo "$sha  $file.part" | sha256sum --check --strict
            mv "$file.part" "$file"
          fi
          echo "$sha  $file" | sha256sum --check --strict
      - name: OpenAI compatibility suite
        run: |
          python3 tests/compat/compat.py \
            --model "$HOME/.cache/peregrine-compat/SmolLM2-360M-Instruct.Q4_K_M.gguf" \
            --peregrine-bin target/release/peregrine --threads 4 --slots 4

  # The oldest compiler we promise to build with (workspace `rust-version`).
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: "1.96" }
      - run: rm rust-toolchain.toml
      - run: cargo +1.96 check --workspace --all-targets --locked

  # Credential files, credential-shaped strings and banned names in tracked text files. Full history so
  # a pull request's commit range is checked too: a credential path a later commit removed still fails.
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: check the tree and the PR's commit range
        env:
          HYGIENE_BANNED_PATTERN: ${{ secrets.HYGIENE_BANNED_PATTERN }}
        run: |
          scripts/hygiene.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/hygiene.sh "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          fi
      - name: self-test
        run: scripts/hygiene-selftest.sh

  # Licenses, advisories, sources and banned crates (deny.toml).
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with: { command: check }

  # The container image builds from the workspace on a native amd64 runner (Docker and BuildKit are
  # preinstalled). Build only: nothing is pushed. Gated by a run of the image's own entrypoint, so a
  # broken ENTRYPOINT/CMD or a binary that cannot start is a failure, not just a successful build.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the image (linux/amd64, no push)
        run: docker build --platform linux/amd64 --tag peregrine:ci .
      - name: run the image's entrypoint
        run: docker run --rm peregrine:ci --help

  # One job the branch protection rule can require, whatever the matrix becomes.
  ci-ok:
    if: always()
    needs: [lint, test, tiers, msrv, supply-chain, compat, docker, hygiene]
    runs-on: ubuntu-24.04
    steps:
      - run: '[ "${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}" = "false" ]'
