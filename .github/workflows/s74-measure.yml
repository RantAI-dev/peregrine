# TEMPORARY (S7.4): sanity measurements on GitHub's Windows and Linux runners.
# Deleted before the pull request is ready; the numbers go in docs/design/s7-platforms.md.
name: s74-measure
on:
  push:
    branches: [s7.4-windows-goldens]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: windows-2025, name: windows }
    name: measure (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: CPU and runner
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH, $(nproc 2>/dev/null || true) cpus"
          case "$RUNNER_OS" in
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            *) grep -m1 'model name' /proc/cpuinfo || true ;;
          esac
      - name: build the binary
        run: cargo build --release --locked -p peregrine
      - name: fetch SmolLM2-360M-Instruct Q4_K_M (pinned SHA-256)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/models"
          file="$dir/SmolLM2-360M-Instruct.Q4_K_M.gguf"
          sha="ade7aee1e5bd7c3b8f1fedafc61a1a0be31e8afa64e006607cd202323e2ccce0"
          mkdir -p "$dir"
          # To the final name, so the first load below is the first open of the written file
          # (the design's Defender open point). The hash is checked after the two loads; a
          # mismatch fails the step and the numbers are discarded.
          curl --fail --location --retry 3 --silent --show-error \
            -o "$file" \
            "https://huggingface.co/mradermacher/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct.Q4_K_M.gguf"
          ls -l "$file"
      - name: load, first and second run; bench; Windows lifetime
        run: |
          set -uo pipefail
          exe=target/release/peregrine
          [ -f "$exe.exe" ] && exe="$exe.exe"
          model="$RUNNER_TEMP/models/SmolLM2-360M-Instruct.Q4_K_M.gguf"
          state="$RUNNER_TEMP/state"
          mkdir -p "$state"
          export PEREGRINE_STATE_DIR="$state"
          sha="ade7aee1e5bd7c3b8f1fedafc61a1a0be31e8afa64e006607cd202323e2ccce0"

          echo "=== tier"
          "$exe" tier | head -1

          echo "=== load, first run after download"
          port=18201
          t0=$(date +%s%N)
          "$exe" serve -m "$model" --port $port --threads 4 --background
          ready=$(( ($(date +%s%N) - t0) / 1000000 ))
          log="$state/serve-$port.log"
          for i in $(seq 1 100); do grep -q 'loaded in' "$log" 2>/dev/null && break; sleep 0.1; done
          echo "load1_start_ms $ready"
          grep -o 'loaded in [0-9.]* s' "$log" | head -1
          "$exe" stop

          echo "=== load, second run"
          port=18202
          t0=$(date +%s%N)
          "$exe" serve -m "$model" --port $port --threads 4 --background
          ready=$(( ($(date +%s%N) - t0) / 1000000 ))
          log="$state/serve-$port.log"
          for i in $(seq 1 100); do grep -q 'loaded in' "$log" 2>/dev/null && break; sleep 0.1; done
          echo "load2_start_ms $ready"
          grep -o 'loaded in [0-9.]* s' "$log" | head -1
          "$exe" stop

          echo "=== bench, five runs, 512-token prompt, 4 threads"
          for i in 1 2 3 4 5; do
            "$exe" bench -m "$model" --prompt-tokens 512 --tokens 64 --threads 4 --json \
              > "$RUNNER_TEMP/bench-$i.json"
            pre=$(grep -o '"prefill_tok_s": [0-9.]*' "$RUNNER_TEMP/bench-$i.json" | awk '{print $2}')
            dec=$(grep -o '"decode_tok_s": [0-9.]*' "$RUNNER_TEMP/bench-$i.json" | awk '{print $2}')
            echo "bench run=$i prefill=$pre decode=$dec"
          done

          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "=== serve --background, time to /health, one chat request, stop"
            port=18203
            t0=$(date +%s%N)
            "$exe" serve -m "$model" --port $port --threads 4 --background
            code=000
            for i in $(seq 1 600); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/health" || true)
              [ "$code" = "200" ] && break
              sleep 0.1
            done
            echo "health_ms $(( ($(date +%s%N) - t0) / 1000000 )) code=$code"
            chat=$(curl -sS -o /dev/null -w '%{time_total}' -X POST \
              "http://127.0.0.1:$port/v1/chat/completions" \
              -H 'Content-Type: application/json' \
              -d '{"model":"peregrine","messages":[{"role":"user","content":"Say hello in one word."}],"max_tokens":8,"temperature":0}')
            echo "chat_s $chat"
            t0=$(date +%s%N)
            "$exe" stop
            echo "stop_ms $(( ($(date +%s%N) - t0) / 1000000 ))"
            "$exe" status || echo "status: no managed server"
          fi

          echo "=== verify the download"
          got=$(sha256sum "$model" | awk '{print $1}')
          echo "sha256 $got"
          [ "$got" = "$sha" ] || { echo "model SHA-256 mismatch" >&2; exit 1; }
