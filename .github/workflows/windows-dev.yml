# TEMPORARY development loop for S7.2. Deleted before the PR; the permanent job is in ci.yml.
name: windows-dev
on:
  push:
    branches: [s7.2-windows-ci]
permissions:
  contents: read
concurrency:
  group: windows-dev-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: test
        shell: pwsh
        run: |
          cargo test --workspace --release --locked --no-fail-fast 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\\test.log"
          exit $LASTEXITCODE
      - name: upload log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-log
          path: ${{ runner.temp }}\test.log
          if-no-files-found: warn
