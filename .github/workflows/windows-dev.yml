# Temporary development loop for S7.3 (Windows lifetime, installer, archive). Deleted before the
# pull request is ready; the permanent checks live in ci.yml.
name: windows-dev
on:
  push:
    branches: [s7.3-windows-lifetime]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
jobs:
  windows-dev:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: lifetime tests
        shell: pwsh
        run: |
          cargo test --release --locked -p peregrine --test serve_lifetime --test server_multi_model 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/lifetime.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: archive
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/build.ps1 x86_64-pc-windows-msvc 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/archive.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length
      - name: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "v" + ((Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' |
            Select-Object -First 1).Matches.Groups[1].Value)
          $dir = Join-Path $env:RUNNER_TEMP "peregrine-install"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Version $version -BaseUrl (Join-Path $PWD "dist") -InstallDir $dir 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $dir "peregrine.exe") --version
          & (Join-Path $dir "peregrine.exe") tier
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-dev-logs
          path: |
            ${{ runner.temp }}/*.log
            dist/*
          if-no-files-found: warn
