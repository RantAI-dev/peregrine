name: Feature request
description: Something new for the engine or the server.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
