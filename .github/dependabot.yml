version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      server-deps:
        patterns: ["axum*", "tokio*", "tower*", "hyper*", "serde*", "clap*", "tracing*", "futures*"]
    commit-message: { prefix: "deps" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
